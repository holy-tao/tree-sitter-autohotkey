name: CI

# NOTE: GitHub Actions does not support YAML anchors, so the two `paths` lists
# below have to be kept in sync by hand.
on:
  push:
    paths:
      - grammar.js
      - src/**
      - queries/**
      - web/**
      - .github/**
      - "**/*.md"
      - eslint.config.js
      - .markdownlint-cli2.jsonc
      - .clang-tidy
      - Makefile
      - package.json
  pull_request:
    branches: [main]
    paths:
      - grammar.js
      - src/**
      - queries/**
      - web/**
      - .github/**
      - "**/*.md"
      - eslint.config.js
      - .markdownlint-cli2.jsonc
      - .clang-tidy
      - Makefile
      - package.json
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Tree-sitter
        uses: ./.github/actions/setup

      - run: tree-sitter test

  # Independent of `test` in both directions: a lint failure never stops the test
  # suite from running, but it does gate `publish` / `deploy-pages` below.
  #
  # Needs no tree-sitter setup -- eslint reads grammar.js directly, and the
  # headers scanner.c includes are committed under src/tree_sitter/.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install lint dependencies
        run: npm ci --ignore-scripts

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      # Each linter runs even if an earlier one failed, so one push surfaces
      # every problem instead of one at a time.
      - name: ESLint (grammar.js)
        if: ${{ !cancelled() }}
        run: npm run lint:js

      - name: markdownlint
        if: ${{ !cancelled() }}
        run: npm run lint:md

      - name: Compiler warnings (src/scanner.c)
        if: ${{ !cancelled() }}
        run: make lint-c

  soundness:
    name: Fuzz Soundness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Tree-sitter
        uses: ./.github/actions/setup

      - name: Fetch Fuzz Testing Corpus
        shell: bash
        run: ./test/fuzz/fetch-corpus.sh

      - name: Run Soundness Tests
        shell: pwsh
        run: .\test\fuzz\soundness.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: Soundness Fuzz Test Report
          path: ./test/fuzz/findings/

  fuzz-parser:
    name: Fuzz Parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch Fuzz Testing Corpus
        shell: bash
        run: ./test/fuzz/fetch-corpus.sh

      - name: Fuzz Parser
        uses: tree-sitter/fuzz-action@v4
        with:
          corpus: ./test/fuzz/corpus

  compile:
    name: Compile and Upload Artifacts
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Tree-sitter
        uses: ./.github/actions/setup

      - run: tree-sitter build -o ./tree-sitter-autohotkey.dll

      - uses: actions/upload-artifact@v7
        with:
          name: Compiled Binary & Build Artifacts
          path: |
            ./tree-sitter-autohotkey.dll
            ./src/

  publish:
    name: Publish to crates.io
    needs: [test, lint]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  deploy-pages:
    name: Deploy Playground to Pages
    needs: [test, lint]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
