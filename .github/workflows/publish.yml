name: Publish to crates.io

# Reusable workflow. Called by ci.yml after the test job passes on main; the
# gating (branch / event / needs: test) lives there. Also runnable on its own
# via workflow_dispatch as a manual escape hatch.
on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check whether the version needs publishing
        id: check
        run: |
          local="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tree-sitter-autohotkey") | .version')"
          published="$(curl -s "https://crates.io/api/v1/crates/tree-sitter-autohotkey" \
            -H 'User-Agent: tree-sitter-autohotkey-ci' \
            | jq -r '.versions[].num' 2>/dev/null || true)"
          echo "Cargo.toml version: $local"
          if echo "$published" | grep -qx "$local"; then
            echo "Version $local already on crates.io - nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $local is new - will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Tree-sitter
        uses: ./.github/actions/setup

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
